<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beta App</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #e8f1fb; color: #1b2a41; margin: 0; padding: 0; }
    .box { max-width: 640px; margin: 80px auto; padding: 32px; background: #ffffff; border-top: 8px solid #1f6feb; }
    h1 { color: #1f6feb; margin-top: 0; }
    .port { display: inline-block; padding: 4px 12px; background: #1f6feb; color: #ffffff; font-weight: bold; }
    code { background: #eef2f7; padding: 2px 6px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Beta App</h1>
    <p>Đây là môi trường thử nghiệm Beta, được phục vụ bởi Nginx trên cổng <span class="port">8080</span>.</p>
    <p>Mã nguồn đặt tại <code>/var/www/beta-app/html/</code>, chạy song song với Internal App (cổng 8090) trên cùng một máy chủ.</p>
  </div>
</body>
</html>

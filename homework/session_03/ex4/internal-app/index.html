<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internal App</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #fbeee6; color: #3b2314; margin: 0; padding: 0; }
    .box { max-width: 640px; margin: 80px auto; padding: 32px; background: #ffffff; border-top: 8px solid #d9480f; }
    h1 { color: #d9480f; margin-top: 0; }
    .port { display: inline-block; padding: 4px 12px; background: #d9480f; color: #ffffff; font-weight: bold; }
    code { background: #f7ece4; padding: 2px 6px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Internal App</h1>
    <p>Đây là môi trường nội bộ, được phục vụ bởi Nginx trên cổng <span class="port">8090</span>.</p>
    <p>Mã nguồn đặt tại <code>/var/www/internal-app/html/</code>, chạy song song với Beta App (cổng 8080) trên cùng một máy chủ.</p>
  </div>
</body>
</html>
